name: Home Assistant developer blog

on:
  schedule:
    - cron: '23 7 * * 1'
    # Other days only retry entries already due; they do not scan for new posts.
    - cron: '23 7 * * 0,2-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Gemini and generate a report; do not create an issue'
        type: boolean
        default: true
      since:
        description: 'Include posts from this date (YYYY-MM-DD)'
        type: string
        default: '2026-09-01'
      retry_failed:
        description: 'Retry exhausted entries only (requires dry_run=false)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/ha-developer-blog.yml'
      - 'scripts/ha_blog_monitor.py'
      - 'scripts/ha_blog_gemini.py'
      - 'scripts/ha_blog_scheduler.py'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - '.github/workflows/ha-developer-blog.yml'
      - 'scripts/ha_blog_monitor.py'
      - 'scripts/ha_blog_gemini.py'
      - 'scripts/ha_blog_scheduler.py'
      - 'scripts/tests/**'

permissions:
  contents: read

concurrency:
  group: ha-developer-blog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - run: uv run --no-project --python 3.14 python -m unittest discover -s scripts/tests -v

  monitor:
    needs: test
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'topic2k/enigma2-connect' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Write retry state only on ha-blog-monitor-state, never on main.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: home-assistant/developers.home-assistant
          ref: master
          path: .work/ha-developer-blog
          sparse-checkout: blog
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - name: Assess blog posts
        env:
          GH_TOKEN: ${{ github.token }}
          # Use a dedicated AI Studio Free Tier project WITHOUT paid billing.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SINCE: ${{ inputs.since || '2026-09-01' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
          RETRY_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule != '23 7 * * 1') || inputs.retry_failed == true }}
          RETRY_FAILED: ${{ inputs.retry_failed == true }}
        shell: bash
        run: |
          export BLOG_SHA="$(git -C .work/ha-developer-blog rev-parse HEAD)"
          args=()
          if [ "$PUBLISH" = "true" ]; then
            args+=(--publish)
          fi
          if [ "$RETRY_ONLY" = "true" ]; then
            args+=(--retry-only)
          fi
          if [ "$RETRY_FAILED" = "true" ]; then
            args+=(--retry-failed)
          fi
          uv run --no-project --python 3.14 python scripts/ha_blog_scheduler.py \
            --blog-dir .work/ha-developer-blog/blog --since "$SINCE" "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ha-developer-blog-report
          path: .work/blog-monitor/gemini-report/
          include-hidden-files: true
          retention-days: 30
