reboot:
  fields:
    device_id:
      required: true
      selector: &id001
        device:
          integration: enigma2_connect
restart_gui:
  fields:
    device_id:
      required: true
      selector: *id001
deep_standby:
  fields:
    device_id:
      required: true
      selector: *id001
message:
  fields:
    device_id:
      required: true
      selector: *id001
    text:
      required: true
      selector:
        text: {}
    type:
      required: false
      selector:
        select:
          options: ["0", "1", "2", "3"]
          mode: dropdown
          translation_key: message_type
    timeout:
      required: false
      selector:
        number:
          min: 1
          max: 120
          mode: box
record_now:
  fields:
    device_id:
      required: true
      selector: *id001
timer_add:
  fields:
    device_id:
      required: true
      selector: *id001
    channel:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    service_reference:
      selector:
        text: {}
    begin:
      required: true
      selector:
        datetime: {}
    end:
      required: true
      selector:
        datetime: {}
    name:
      required: true
      selector:
        text: {}
    description:
      required: false
      selector:
        text: {}
    justplay:
      required: false
      selector:
        boolean: {}
    afterevent:
      required: false
      selector:
        select:
          options: ["0", "1", "2", "3"]
          mode: dropdown
          translation_key: after_recording
    weekdays:
      selector:
        select:
          options: [mon, tue, wed, thu, fri, sat, sun]
          multiple: true
          translation_key: timer_weekdays
    directory_selection:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    directory:
      selector:
        text: {}
    tags:
      selector:
        text:
          multiple: true
    disabled:
      selector:
        boolean: {}
    recording_type:
      selector:
        select:
          options: [normal, descrambled, scrambled]
          translation_key: recording_type
timer_delete:
  fields:
    device_id:
      required: true
      selector: *id001
    channel:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    service_reference:
      selector:
        text: {}
    begin:
      required: true
      selector:
        datetime: {}
    end:
      required: true
      selector:
        datetime: {}
timer_toggle:
  fields:
    device_id:
      required: true
      selector: *id001
    channel:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    service_reference:
      selector:
        text: {}
    begin:
      required: true
      selector:
        datetime: {}
    end:
      required: true
      selector:
        datetime: {}
timer_edit:
  fields:
    device_id:
      required: true
      selector: *id001
    channel:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    old_service_reference:
      selector:
        text: {}
    old_begin:
      required: true
      selector:
        datetime: {}
    old_end:
      required: true
      selector:
        datetime: {}
    scope:
      required: true
      selector:
        select:
          options: [single, series]
          translation_key: timer_scope
    begin:
      selector:
        datetime: {}
    end:
      selector:
        datetime: {}
    name:
      selector:
        text: {}
    description:
      selector:
        text: {}
    justplay:
      selector:
        boolean: {}
    afterevent:
      selector:
        select:
          options: ["0", "1", "2", "3"]
          mode: dropdown
          translation_key: after_recording
    weekdays:
      selector:
        select:
          options: [mon, tue, wed, thu, fri, sat, sun]
          multiple: true
          translation_key: timer_weekdays
    directory_selection:
      selector:
        select:
          options: []
          mode: dropdown
          sort: true
    directory:
      selector:
        text: {}
    tags:
      selector:
        text:
          multiple: true
    disabled:
      selector:
        boolean: {}
    recording_type:
      selector:
        select:
          options: [normal, descrambled, scrambled]
          translation_key: recording_type
